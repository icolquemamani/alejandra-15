<section class="section family-section">
  <!-- Banner superior que continúa el degradado del intro -->
  <div class="family-top-banner">
    <div class="banner-sparkle sparkle-1"></div>
    <div class="banner-sparkle sparkle-2"></div>
    <div class="banner-sparkle sparkle-3"></div>
    <div class="banner-sparkle sparkle-4"></div>
    <div class="banner-sparkle sparkle-5"></div>
  </div>

  <div class="family-card fade-in">
    <img src="assets/images/8be15b9222417be1eb3622a62f11494f-copia.webp" alt="Alicia" class="family-photo magical-pulse">
    <div class="family-text slide-up">
      <p class="family-quote">Con el amor y apoyo incondicional<br>de mis padres</p>
      <p class="family-names">Giovanni Gomez<br>Abigail Mamani</p>
    </div>

  <!-- WATCH HERE -->
  <div class="clock-container fade-in">
    <div class="clock">
      <!-- Cara del reloj -->
      <img src="assets/images/Reloj.webp" alt="Reloj" class="clock-face">

      <!-- Horero wrapper: misma dimensión que el reloj, gira desde el centro -->
      <div #hourHand class="clock-hand-wrapper">
        <img src="assets/images/horero.webp" alt="Horero" class="clock-hand">
      </div>

      <!-- Minutero wrapper: misma dimensión que el reloj, gira desde el centro -->
      <div #minuteHand class="clock-hand-wrapper clock-minute">
        <img src="assets/images/Minutero.webp" alt="Minutero" class="clock-hand">
      </div>
    </div>
  </div>
