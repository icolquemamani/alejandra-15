<div class="music-player-container" *ngIf="isVisible">
  <button class="music-btn" (click)="toggleMusic()" [class.playing]="isPlaying" title="Reproducir/Pausar música">
    <span class="icon">
      <!-- Music Icon -->
      <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </span>
  </button>

  <audio #audioPlayer loop (play)="isPlaying = true" (pause)="isPlaying = false">
    <source src="assets/alice_theme.mp3" type="audio/mpeg">
  </audio>
</div>
